<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избосарова Ж.О. - регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="pony-card">

        <img src="Gemini_Generated_Image_2gm88z2gm88z2gm8.png" class="pony-avatar" alt="Аватар">

        <h2>Создать аккаунт 🎀</h2>

        <p class="text-muted mb-4">
            Присоединяйся к уютному сообществу
        </p>

        <form id="regForm">

            <input
                type="text"
                class="form-control"
                placeholder="Логин"
                required
            >

            <input
                type="email"
                class="form-control"
                placeholder="Email"
                required
            >

            <input
                type="password"
                class="form-control"
                placeholder="Пароль"
                required
            >

            <button type="submit" class="btn btn-pink w-100 mt-2">
                Создать аккаунт ✨
            </button>

        </form>

        <div class="mt-4">
            <a href="index.html" class="magic-link">
                Уже есть аккаунт?
            </a>
        </div>

    </div>

    <script src="js/scripts.js"></script>

</body>
</html>
