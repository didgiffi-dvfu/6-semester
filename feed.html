<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избосарова Ж.О. - лента </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">

        <div class="container">

            <a class="navbar-brand" href="#">
                PONYGRAM
            </a>

            <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">
                Выйти
            </a>

        </div>

    </nav>

    <div class="feed-container">

        <div class="create-post-area">

            <h4 class="mb-3">
                Поделиться моментом ✨
            </h4>

            <input
                type="text"
                id="newPostTitle"
                class="form-control"
                placeholder="Название поста"
            >

            <textarea
                id="newPostContent"
                class="form-control"
                rows="4"
                placeholder="Поделись своими мыслями..."
            ></textarea>

            <div class="d-flex justify-content-between align-items-center gap-3">

                <input type="file" class="form-control">

                <button onclick="publishPost()" class="btn btn-pink px-4">
                    Опубликовать
                </button>

            </div>

        </div>

        <div class="post-card">

            <div class="post-img-container">
                <img src="s-l1200.jpg" alt="Вечерний Кантерлот">
            </div>

            <h4>Вечерний Кантерлот</h4>

            <p class="text-muted">
                Невероятно красивый закат сегодня.
                Иногда хочется просто остановиться и насладиться атмосферой ✨
            </p>

            <div class="d-flex justify-content-between align-items-center">

                <button
                    class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                    onclick="this.innerHTML='❤ Добавлено'"
                >
                    ❤ Нравится
                </button>

                <a href="post.html" class="magic-link">
                    Открыть →
                </a>

            </div>

        </div>

        <div class="post-card">

            <div class="post-img-container">
                <img src="image.png" alt="Новый дизайн">
            </div>

            <h4>Новый дизайн</h4>

            <p class="text-muted">
                Экспериментирую с пастельной палитрой
                и мягкими оттенками 💫
            </p>

            <div class="d-flex justify-content-between align-items-center">
                <button
                    class="btn btn-sm btn-outline-secondary rounded-pill px-3 like-btn"
                >
                    ❤ Нравится
                </button>

                <button
                    class="btn btn-sm btn-outline-secondary rounded-pill px-3 save-btn"
                >
                    ☆ Сохранить
                </button>
            </div>

        </div>

    </div>

    <script src="js/scripts.js"></script>

</body>
</html>
